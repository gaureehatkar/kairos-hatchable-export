source:
  type: "postgresql"
  schema: "commerce"
  extract_lineage: true
  
ml_tracking:
  type: "mlflow"
  tracking_uri: "http://localhost:5000"
  extract_models: true
  
destination:
  type: "kairos_rest_api"
  config:
    endpoint: "YOUR_PROJECT_URL_HERE/api/v1/ingest"
    # Paste the token generated from your Integrations UI here:
    token: "krs_live_EXAMPLE_TOKEN"